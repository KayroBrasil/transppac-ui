
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | HMS Transport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="body-centered">

    <div class="form-container">
        <div class="brand-stripe"></div>

        <div class="form-header">
            <h1>Criar Conta</h1>
            <p>Cadastre-se para acessar o HMS Transport</p>
        </div>

        <form class="main-form" id="form-cadastro">

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" id="email" name="email"
                       placeholder="exemplo@hmstransport.com.br" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="Crie uma senha forte"
                       minlength="8" required>
            </div>

            <div class="input-group">
                <label for="setor">Setor</label>
                <select id="setor" name="setor" required>
                    <option value="">Selecione o seu setor...</option>
                    <option value="recepcao">Recepção</option>
                    <option value="enfermagem">Enfermagem</option>
                    <option value="maqueiros">Maqueiros</option>
                    <option value="administracao">Administração</option>
                    <option value="ti">Tecnologia da Informação</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">
                Finalizar Cadastro
            </button>

            <div id="feedback" class="feedback-message"
                 role="status" aria-live="polite"></div>

            <p class="form-link">
                Já possui uma conta?
                <a href="index.html">Faça login aqui</a>
            </p>

        </form>
    </div>

    <script src="js/cadastro.js"></script>
</body>
</html>
