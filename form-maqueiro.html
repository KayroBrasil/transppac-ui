
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Maqueiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-centered">

    <main class="form-container cadastro-maqueiro">

        <header class="form-header">
            <div class="faixa-colorida"></div>

            <div class="form-header-content">
                <h1>Cadastro de Maqueiro</h1>
                <p>Registre os dados do profissional de transporte</p>
            </div>
        </header>

        <form id="form-maqueiro">

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input
                    type="text"
                    id="matricula"
                    name="matricula"
                    placeholder="Ex: 2026-12345"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome do maqueiro"
                    required
                >
            </div>

            <div class="form-group">
                <label for="equipe">Equipe (Plantão)</label>
                <select id="equipe" name="equipe" required>
                    <option value="">Selecione a equipe...</option>
                    <option value="A">Equipe A</option>
                    <option value="B">Equipe B</option>
                    <option value="C">Equipe C</option>
                    <option value="D">Equipe D</option>
                </select>
            </div>

            <button type="submit">Salvar Registro</button>

        </form>

    </main>
<script src="js/maqueiro.js"></script>
</body>
</html>
