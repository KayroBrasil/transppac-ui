<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Setores | HMS Transport</title>
    <!-- Referência ao CSS global -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-centered">

    <div class="request-container">
        <!-- Faixa de cores da logomarca -->
        <div class="brand-stripe"></div>
        
        <div class="request-header">
            <h1>Cadastro de Setor</h1>
            <p>Adicione um novo setor ao sistema</p>
        </div>

        <form class="request-form" id="form-setor">
            <div class="input-group">
                <label for="nome">Nome do Setor</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Ala Pediátrica" required>
            </div>

            <button type="submit" class="btn-submit">Salvar Setor</button>

            <!-- Área de feedback de sucesso ou erro -->
            <div id="feedback" class="feedback-message"></div>
        </form>
    </div>

    <script src="js/setor.js"></script>
</body>
</html>
