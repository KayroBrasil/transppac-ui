<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HMS Transport</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-centered">

    <div class="form-container">
        <!-- Faixa de cores da logomarca -->
        <div class="brand-stripe"></div>
        
        <div class="form-header">
            <h1>HMS Transport</h1>
            <p>Sistema de Gestão do Transporte de Pacientes</p>
        </div>

        <form class="main-form" id="form-login">
            <div class="input-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" id="email" name="email" placeholder="maqueiro@hmstransport.com.br" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Acessar Sistema</button>

            <!-- Área para exibir mensagens de erro/sucesso via JS -->
            <div id="feedback" class="feedback-message"></div>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
